[project]
name = "jev-voice"
version = "0.1.0"
description = "Talk to your Mac. Local whisper.cpp + one Jev (TypeSafe System One) call per command + macOS automation."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "chess>=1.11.2",
    "httpx>=0.28.1",
    "jev-ultrafast",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
jev-voice = "jev_voice.main:main"
jev-agent = "jev_voice.agent:main"
jev-inspect = "jev_voice.inspector:main"
jev-modes = "jev_voice.modes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_voice"]
include = ["jev_voice/static/*", "jev_voice/static_modes/*"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Pre-agent modules keep their compact style.
"jev_voice/{actions,audio,brain,main,overlay}.py" = ["E402", "E501", "E701", "E702", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
jev-ultrafast = { git = "https://github.com/browser-use/jev-ultrafast.git" }
